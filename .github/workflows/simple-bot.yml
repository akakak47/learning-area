name: 🤖 Simple Bot Example (修复版)

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: '提交信息'
        required: true
        default: 'chore: simple-bot 自动更新'

jobs:
  bot-work:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0                    # 关键：完整拉取历史，避免 rebase 问题

      - name: 模拟 AI 修改文件
        run: |
          echo "🤖 Bot 在 $(date '+%Y-%m-%d %H:%M:%S') 自动更新了这个文件" >> bot-log.txt
          echo "最后运行时间: $(date -u)" > .last-bot-run

      - name: 创建 Pull Request（自动识别 master / main）
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ github.event.inputs.commit_message }}
          title: '🤖 Simple Bot 自动更新'
          body: |
            ## 🤖 机器人自动创建的 PR（已修复）
            
            这个 PR 由 GitHub Actions 机器人自动生成。
            
            **修改内容**:
            - 新增 `bot-log.txt`
            - 新增 `.last-bot-run`
          branch: simple-bot/update-${{ github.run_number }}
          base: ${{ github.event.repository.default_branch }}   # ← 关键修复：自动识别 master 或 main
          author: simple-bot[bot] <simple-bot[bot]@users.noreply.github.com>
          committer: simple-bot[bot] <simple-bot[bot]@users.noreply.github.com>
          delete-branch: true
